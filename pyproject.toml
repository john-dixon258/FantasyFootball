[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-ai-analyst"
version = "0.1.0"
description = "Tools to help Fantasy Premier League managers make better decisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
fpl-analyst = "fantasy_football_ai_analyst.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fantasy_football_ai_analyst = ["sample_players.json", "web/*"]
