[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-ai-analyst"
version = "0.1.0"
description = "Tools to help Fantasy Premier League managers make better decisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fpl-analyst = "fantasy_football_ai_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fantasy_football_ai_analyst = ["sample_players.json"]
